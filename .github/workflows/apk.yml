name: APK ビルド

# 手動実行（workflow_dispatch）と v* タグ push のときに Android APK をビルドする。
# このワークフローは .github/workflows/ci.yml（Web版のテスト・GitHub Pages
# デプロイ）とは完全に独立しており、ci.yml の挙動には一切影響しない。
#
# このマシン（開発環境）には Java も Android SDK も入っておらず、sudo も使えない
# ため、APK のビルドは常にこの GitHub Actions ランナー上（Java・Android SDK が
# 事前に入っている ubuntu-latest イメージ）で行う。ローカルで ./gradlew を
# 実行することはない。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Android APK ビルド（デバッグ署名）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # android/app/build.gradle の versionCode/versionName 直上のコメントには
      # 「リリースのたびに必ず versionCode と versionName の両方を上げること」と
      # 明記されているが、これはただのコメントであり、上げ忘れてもビルドは
      # 普通に成功してしまう。サイドロードで入れ替える運用のため、端末の
      # 「設定 → アプリ」で見えるのはバージョン文字列だけであり、上げ忘れに
      # 気付く手段がこれまで何も無かった（このルール自体、実際には一度も
      # 検証されたことがない）。
      # ここでタグ名（例: v1.3.0）から先頭の v を除いた文字列と、
      # build.gradle の versionName が一致することを検査し、食い違って
      # いたら即座に落とす。Android ビルド（Gradle）は10分以上かかるため、
      # わざわざそれを待たせずに済むよう、checkout 直後のこの時点で検査する。
      # workflow_dispatch（手動実行）にはタグが存在しないため、この検査自体を
      # スキップする（github.ref_type がタグ push のときだけ 'tag' になる）。
      - name: タグ名と versionName の一致を確認
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "タグ: $GITHUB_REF_NAME（バージョン部分: $TAG_VERSION）"
          echo "android/app/build.gradle の versionName: $GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::タグ '$GITHUB_REF_NAME' と android/app/build.gradle の versionName ('$GRADLE_VERSION') が一致していません。android/app/build.gradle の versionCode と versionName を上げ忘れていないか確認してください。"
            exit 1
          fi
          echo "OK: タグと versionName が一致しています"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 依存インストール
        run: pnpm install --frozen-lockfile

      # 型チェック・Lint・テストは ci.yml の verify ジョブで既に検証されている前提だが、
      # タグ push など verify を経由しない起動経路もあるため、ここでも最低限
      # ビルドが通ることを確認する（ビルド自体が失敗すれば以降のジョブは動かない）。
      - name: APK 用ビルド（Service Worker なし）＋ Capacitor 同期
        run: pnpm run build:apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: デバッグ APK をビルド
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK パスを特定
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK が見つかりませんでした"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # このアプリは INTERNET 権限を持たないこと自体を最も強いプライバシー保証に
      # している。ところが Android のマニフェストマージャは依存ライブラリ（AAR）の
      # <uses-permission> を最終マニフェストへ自動で合流させるため、ライブラリを
      # 1つ足しただけで INTERNET が黙って復活し得る（しかもビルドは成功する）。
      # AndroidManifest.xml 側で tools:node="remove" して剥がしているが、それが
      # 実際に効いているかは「ビルド成果物を見る」以外に確かめようがない。
      # ここで実際の APK の権限一覧を検査し、復活していたらビルドを落とす。
      - name: INTERNET 権限が含まれていないことを確認
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 が見つからず、権限の検証ができませんでした"
            exit 1
          fi
          echo "使用する aapt2: $AAPT2"
          PERMS=$("$AAPT2" dump permissions "${{ steps.apk.outputs.path }}")
          echo "--- APK が要求する権限 ---"
          echo "$PERMS"
          if echo "$PERMS" | grep -q 'android.permission.INTERNET'; then
            echo "::error::APK に INTERNET 権限が含まれています。依存ライブラリのマニフェストから合流した可能性があります（android/app/src/main/AndroidManifest.xml の tools:node=\"remove\" 宣言を確認してください）"
            exit 1
          fi
          echo "OK: INTERNET 権限は含まれていません"

      # PaddleOCR（読めないとき用の第2のOCRエンジン）の実体である ONNX モデル2つ・
      # 文字辞書・ONNX Runtime の wasm/mjs は、`pnpm run build:apk` の中の
      # `cap sync android` が public/vendor/ から android/app/src/main/assets/public/vendor/
      # へコピーする素朴な仕組みだけで APK に同梱されている。この経路のどこかで
      # ファイルが1つでも欠けても、それ自体は Gradle のビルドを失敗させない
      # （アセットが足りないだけの APK は普通に完成してしまう）。
      # その結果、ビルドもテストも全部緑のまま、実機で「精密読み取り」ボタンを
      # 押した瞬間だけモデルの取得に失敗して機能が動かない、という極めて
      # 気付きにくい壊れ方をする。
      # 「INTERNET 権限が含まれていないことを確認」ステップと同じ発想で、ここでも
      # ビルドした APK の中身を実際に検査し、欠けていたらビルドを落とす。
      # assets/ 配下はコンパイル済みリソースではなく単純に zip へ格納される
      # だけの生ファイルなので、aapt2 のような専用ツールは不要で、軽量な
      # unzip -l によるファイル一覧の確認で十分。
      - name: PaddleOCR 同梱物が APK に含まれていることを確認
        run: |
          set -euo pipefail
          REQUIRED_FILES=(
            "assets/public/vendor/onnxruntime/ort-wasm-simd-threaded.wasm"
            "assets/public/vendor/onnxruntime/ort-wasm-simd-threaded.mjs"
            "assets/public/vendor/paddleocr/ppocrv5-mobile-det.onnx"
            "assets/public/vendor/paddleocr/ppocrv5-mobile-rec.onnx"
            "assets/public/vendor/paddleocr/ppocrv5_dict.txt"
          )
          LISTING=$(unzip -l "${{ steps.apk.outputs.path }}" | awk '{print $NF}')
          echo "--- APK 内の vendor/ 一覧 ---"
          echo "$LISTING" | grep '/vendor/' || true
          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if ! echo "$LISTING" | grep -qx "$f"; then
              echo "::error::APK に $f が含まれていません。PaddleOCR による「精密読み取り」が実機で動作しません（public/vendor/ の同梱漏れ、または cap sync 忘れの可能性があります）"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "OK: PaddleOCR 同梱物5ファイルはすべて含まれています"

      - name: APK サイズをジョブサマリーに表示
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 が見つからず、バージョン情報の取得ができませんでした"
            exit 1
          fi
          # サイドロードで入れ替える運用のため、端末の「設定 → アプリ」以外に
          # 版数を確認する手段が乏しい。このジョブサマリーを見るだけで、
          # 今回ビルドされた APK が android/app/build.gradle のどの
          # versionCode / versionName に対応するものかを判別できるようにする。
          VERSION_LINE=$("$AAPT2" dump badging "${{ steps.apk.outputs.path }}" | grep '^package:')
          echo "### APK 情報" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$VERSION_LINE" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "${{ steps.apk.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
          du -h "${{ steps.apk.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**注意**: これはデバッグ署名の APK です。サイドロード（提供元不明のアプリとしてのインストール）による社内配布向けであり、Google Play への公開にはリリース用キーストアで署名し直す必要があります。" >> "$GITHUB_STEP_SUMMARY"

      - name: APK をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: dlabel-scanner-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error
