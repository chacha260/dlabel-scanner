name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに絞る（進行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: 型チェック・Lint・テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 依存インストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm exec tsc -b --force

      - name: Lint
        run: pnpm lint

      - name: テスト
        run: pnpm test

      # 依存パッケージを追加・更新したのに同梱ライセンス一覧（src/licenses/generated.ts）の
      # 再生成を忘れる、という事故を防ぐ。このアプリは完全オフライン動作が要件で、
      # ライセンス表記もビルド成果物に同梱している以上、一覧が実際の依存から
      # ずれている状態で配布してしまうのは避けたい（詳細は docs/licenses.md）。
      - name: 同梱ライセンス一覧が最新か確認
        run: pnpm run licenses:check

  build:
    name: ビルド
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 依存インストール
        run: pnpm install --frozen-lockfile

      - name: ビルド
        # GitHub Pages はリポジトリ名のサブパス配信になるため base を注入する。
        # ユーザーサイト（<user>.github.io）の場合は自動的に "/" になる。
        run: pnpm build
        env:
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}

      - name: バンドルサイズを表示
        # 以前はここに tesseract.js のエンジン一式（public/vendor/tesseract、約9MB）の
        # サイズも表示していたが、tesseract.js を完全に削除し public/vendor 自体が
        # 無くなったため削除した（dist/vendor が存在せず du がエラーになる）。
        run: |
          echo "### バンドル構成" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* dist/index.html 2>/dev/null | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 以前はここに「Service Worker が OCR エンジンをプリキャッシュしていないことを確認」
      # というゲートがあった（tesseract.js 一式・約9MBが初回インストール時に落ちてきて
      # 「軽さ」の要件を満たさなくなる回帰を防ぐためのもの）。tesseract.js を完全に
      # 削除して以降、OCRエンジン（ML Kit）はAndroidアプリのネイティブ側に組み込まれる
      # ものであり、そもそも Web バンドル・Service Worker のキャッシュ対象になり得ない
      # （public/vendor 自体が存在しない）。このゲートが守っていた回帰は構造的に
      # 発生しなくなったため、意味のあるチェックとして書き直すことができず削除した。

      - name: Pages 用にアップロード
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: GitHub Pages へデプロイ
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
