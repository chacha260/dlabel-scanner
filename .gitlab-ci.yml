# GitLab CI の入口。定義の実体は gitlab/ci/ 以下にある。
# GitLab は .gitlab-ci.yml をリポジトリ直下から読むため、このファイル自体は移動できない。
#
# 各ジョブの内容と、社内GitLabで運用する際の確認事項は gitlab/README.md を参照。

include:
  - local: gitlab/ci/base.yml
  - local: gitlab/ci/verify.yml
  - local: gitlab/ci/build.yml
  - local: gitlab/ci/pages.yml
  - local: gitlab/ci/apk.yml
