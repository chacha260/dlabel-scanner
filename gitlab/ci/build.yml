# ビルドと Service Worker の検査。GitHub Actions の ci.yml の build ジョブに対応する。

build:
  extends: .node-job
  stage: build
  needs: [verify]
  script:
    # GitLab Pages はサブパス配信になるため、CI_PAGES_URL からパス部分を取り出して base に渡す。
    # プロジェクト名やグループ構成が変わっても、この定義を直す必要はない。
    - |
      RAW_PATH="$(printf '%s' "${CI_PAGES_URL:-}" | sed -E 's#^https?://[^/]*##')"
      export BASE_PATH="$(printf '%s/' "$RAW_PATH" | sed -E 's#//+#/#g')"
      echo "BASE_PATH=$BASE_PATH"
    - pnpm build
    # 以前はここに「OCRエンジン(tesseract.js、約16MB)がプリキャッシュに混入していないか」
    # を確認するチェックがあった（GitHub Actions 側の ci.yml と対になる仕組み）。
    # tesseract.js を完全に削除し public/vendor 自体が無くなったため、OCRエンジン
    # （ML Kit）はそもそも Web バンドル・Service Worker のキャッシュ対象になり得ず、
    # このチェックが守っていた回帰は構造的に発生しなくなったので削除した。
    - du -h dist/assets/* | sort -h
  artifacts:
    paths:
      - dist
    expire_in: 1 week
